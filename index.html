<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اقرأ معي — المعلّم الذكي الصغير</title>
    <!-- Tailwind CSS للتصميم -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- خط عربي (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        /* تأثير اهتزاز خفيف عند الخطأ */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- خلفية تفاعلية بصرية لطيفة -->
    <div class="absolute -top-10 -right-10 w-48 h-48 bg-white/10 rounded-full blur-2xl"></div>
    <div class="absolute -bottom-10 -left-10 w-48 h-48 bg-yellow-300/10 rounded-full blur-2xl"></div>

    <div id="main-container" class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-6 md:p-10 w-full max-w-xl text-center border-4 border-amber-300 transition-all duration-300">
        
        <!-- العنوان والشعار -->
        <div class="mb-4">
            <span class="text-4xl inline-block animate-bounce">🌟</span>
            <h1 class="text-3xl md:text-4xl font-black text-indigo-900 mt-1">اقرأ معي</h1>
            <p class="text-gray-500 font-bold text-sm">المعلّم الذكي الصغير (مشروع معاذ)</p>
        </div>

        <!-- منطقة عرض الكلمة والصورة مع تأثيرات بصرية سلسة -->
        <div id="game-card" class="bg-amber-50/80 rounded-2xl p-6 mb-6 border-2 border-dashed border-amber-300 shadow-inner transition-transform duration-300">
            <div id="word-emoji" class="text-7xl md:text-8xl mb-3 transition-transform duration-300 hover:scale-110">🐪</div>
            <div id="word-display" class="text-5xl md:text-6xl font-black text-gray-800 tracking-wider transition-all duration-300">جَمَل</div>
            <div id="syllables-display" class="text-2xl text-indigo-600 font-bold mt-3 hidden bg-indigo-50 py-2 rounded-xl border border-indigo-100">جَـ — مَـ — لْ</div>
        </div>

        <!-- منطقة التغذية الراجعة -->
        <div id="feedback-area" class="h-14 flex items-center justify-center mb-6">
            <p id="feedback-text" class="text-lg md:text-xl font-bold text-gray-600">انطق الكلمة أو اضغط تحقق:</p>
        </div>

        <!-- أزرار التفاعل الحقيقية -->
        <div class="flex flex-col gap-3">
            
            <!-- زر الميكروفون الأساسي (التحقق الصوتي) -->
            <button id="mic-btn" onclick="startListening()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-lg font-bold py-3.5 px-6 rounded-2xl shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
                <span>🎙️</span> اضغط هنا وابدأ القراءة بصوتك
            </button>

            <!-- أزرار التقييم المباشر (صح / خطأ) -->
            <div class="flex gap-3 justify-center">
                <button onclick="handleCorrect()" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white text-base font-bold py-3 px-4 rounded-2xl shadow transition transform active:scale-95 cursor-pointer flex items-center justify-center gap-1">
                    ✅ قرأها صح
                </button>
                <button onclick="handleIncorrect()" class="flex-1 bg-rose-500 hover:bg-rose-600 text-white text-base font-bold py-3 px-4 rounded-2xl shadow transition transform active:scale-95 cursor-pointer flex items-center justify-center gap-1">
                    ❌ أخطأ فيها
                </button>
            </div>

            <!-- مكان ظهور زر الاستماع عند الخطأ -->
            <div id="audio-container" class="my-1"></div>

            <!-- زر التخطي -->
            <button id="skip-btn" onclick="skipWord()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-sm font-bold py-2 px-6 rounded-full shadow-sm transition cursor-pointer self-center">
                ⏭️ تخطي هذه الكلمة
            </button>
            
            <!-- زر الكلمة التالية -->
            <button id="next-btn" onclick="nextWord()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xl font-bold py-3 px-6 rounded-full shadow-lg hidden cursor-pointer transform hover:scale-105 transition">
                الكلمة التالية ➡️
            </button>
        </div>

        <!-- عداد النجوم وتصميمها المطور -->
        <div class="mt-5 flex items-center justify-center gap-2 text-amber-500 text-2xl font-black bg-amber-50 py-2 px-4 rounded-2xl border border-amber-200 shadow-sm w-fit mx-auto">
            <span>⭐</span> النجوم: <span id="score" class="text-indigo-900">0</span>
        </div>

    </div>

    <!-- رقم الإصدار v1.0.17 في الزاوية السفلية اليمنى -->
    <div class="absolute bottom-3 right-4 bg-black/30 backdrop-blur-md text-white text-xs font-mono px-3 py-1.5 rounded-full shadow-lg border border-white/10">
        v1.0.17 (Voice + UI) 🚀
    </div>

    <script>
        // قائمة الكلمات الشاملة (30 كلمة مع التشكيل والوقف الساكن)
        let wordsPool = [
            { word: "جَمَل", emoji: "🐪", syllables: "جَـ — مَـ — لْ", vocalized: "جَمَلْ", weight: 1 },
            { word: "قلم", emoji: "✏️", syllables: "قَـ — لَـ — مْ", vocalized: "قَلَمْ", weight: 1 },
            { word: "تفاحة", emoji: "🍎", syllables: "تُـ — فَـ — ا — حَـ — ةْ", vocalized: "تُفَّاحَةْ", weight: 1 },
            { word: "شمس", emoji: "☀️", syllables: "شَـ — مْـ — سْ", vocalized: "شَمْسْ", weight: 1 },
            { word: "كتاب", emoji: "📖", syllables: "كِـ — تَـ — ا — بْ", vocalized: "كِتَابْ", weight: 1 },
            { word: "أسد", emoji: "🦁", syllables: "أَ — سَـ — دْ", vocalized: "أَسَدْ", weight: 1 },
            { word: "كرة", emoji: "⚽", syllables: "كُـ — رَ — ةْ", vocalized: "كُرَةْ", weight: 1 },
            { word: "بيت", emoji: "🏠", syllables: "بَـ — يْـ — تْ", vocalized: "بَيْتْ", weight: 1 },
            { word: "باب", emoji: "🚪", syllables: "بَـ — ا — بْ", vocalized: "بَابْ", weight: 1 },
            { word: "موز", emoji: "🍌", syllables: "مَـ — وْ — زْ", vocalized: "مَوْزْ", weight: 1 },
            { word: "برتقال", emoji: "🍊", syllables: "بُـ — رْ — تُـ — قَـ — ا — لْ", vocalized: "بُرْتُقَالْ", weight: 1 },
            { word: "حليب", emoji: "🥛", syllables: "حَـ — لِـ — ي — بْ", vocalized: "حَلِيبْ", weight: 1 },
            { word: "ماء", emoji: "💧", syllables: "مَـ — ا — ءْ", vocalized: "مَاءْ", weight: 1 },
            { word: "قمر", emoji: "🌙", syllables: "قَـ — مَـ — رْ", vocalized: "قَمَرْ", weight: 1 },
            { word: "نجمة", emoji: "⭐", syllables: "نَـ — جْـ — مَـ — ةْ", vocalized: "نَجْمَةْ", weight: 1 },
            { word: "زهرة", emoji: "🌸", syllables: "زَ — هْـ — رَ — ةْ", vocalized: "زَهْرَةْ", weight: 1 },
            { word: "شجرة", emoji: "🌳", syllables: "شَـ — جَـ — رَ — ةْ", vocalized: "شَجَرَةْ", weight: 1 },
            { word: "سمكة", emoji: "🐟", syllables: "سَـ — مَـ — كَـ — ةْ", vocalized: "سَمَكَةْ", weight: 1 },
            { word: "عصفور", emoji: "🐦", syllables: "عُـ — صْـ — فُـ — و — رْ", vocalized: "عُصْفُورْ", weight: 1 },
            { word: "حصان", emoji: "🐎", syllables: "حِـ — صَـ — ا — نْ", vocalized: "حِصَانْ", weight: 1 },
            { word: "دجاجة", emoji: "🐔", syllables: "دَ — جَـ — ا — جَـ — ةْ", vocalized: "دَجَاجَةْ", weight: 1 },
            { word: "حقيبة", emoji: "🎒", syllables: "حَـ — قِـ — ي — بَـ — ةْ", vocalized: "حَقِيبَةْ", weight: 1 },
            { word: "كرسي", emoji: "🪑", syllables: "كُـ — رْ — سِـ — يْ", vocalized: "كُرْسِيّْ", weight: 1 },
            { word: "قلم", emoji: "✒️", syllables: "قَـ — لَـ — مْ", vocalized: "قَلَمْ", weight: 1 },
            { word: "مدرسة", emoji: "🏫", syllables: "مَـ — دْ — رَ — سَـ — ةْ", vocalized: "مَدْرَسَةْ", weight: 1 },
            { word: "دمية", emoji: "🧸", syllables: "دُ — مْـ — يَـ — ةْ", vocalized: "دُمْيَةْ", weight: 1 },
            { word: "سيارة", emoji: "🚗", syllables: "سَـ — يَّـ — ا — رَ — ةْ", vocalized: "سَيَّارَةْ", weight: 1 },
            { word: "طائرة", emoji: "✈️", syllables: "طَـ — ا — ئِـ — رَ — ةْ", vocalized: "طَائِرَةْ", weight: 1 },
            { word: "قارب", emoji: "⛵", syllables: "قَـ — ا — رِ — بْ", vocalized: "قَارِبْ", weight: 1 },
            { word: "علم", emoji: "🇸🇦", syllables: "عَـ — لَـ — مْ", vocalized: "عَلَمْ", weight: 1 }
        ];

        let currentIndex = 0;
        let score = 0;
        let currentTargetWord = "";
        let currentVocalizedText = "";

        function loadNewWord() {
            let totalWeight = wordsPool.reduce((sum, item) => sum + item.weight, 0);
            let randomNum = Math.random() * totalWeight;
            let currentSum = 0;

            for (let i = 0; i < wordsPool.length; i++) {
                currentSum += wordsPool[i].weight;
                if (randomNum <= currentSum) {
                    currentIndex = i;
                    break;
                }
            }

            let current = wordsPool[currentIndex];
            currentTargetWord = current.word;
            currentVocalizedText = current.vocalized;

            const card = document.getElementById("game-card");
            card.classList.add("scale-95", "opacity-50");
            
            setTimeout(() => {
                document.getElementById("word-emoji").innerText = current.emoji;
                document.getElementById("word-display").innerText = current.word;
                document.getElementById("syllables-display").innerText = current.syllables;
                document.getElementById("syllables-display").classList.add("hidden");
                document.getElementById("feedback-text").innerText = "انطق الكلمة أو اضغط تحقق:";
                document.getElementById("feedback-text").className = "text-lg md:text-xl font-bold text-gray-600";
                
                card.classList.remove("scale-95", "opacity-50");
            }, 150);

            document.getElementById("mic-btn").classList.remove("hidden");
            document.getElementById("skip-btn").classList.remove("hidden");
            document.getElementById("next-btn").classList.add("hidden");
            document.getElementById("audio-container").innerHTML = "";
        }

        // دالة التحقق الصوتي عبر الميكروفون
        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("متصفحك لا يدعم التحقق الصوتي المباشر، يجدر استخدام أزرار التقييم أدناه.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            document.getElementById("feedback-text").innerText = "جاري الاستماع لصوتك... 🎧";
            document.getElementById("mic-btn").classList.add("animate-pulse", "bg-amber-500");

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript.trim();
                if (speechResult.includes(currentTargetWord)) {
                    handleCorrect();
                } else {
                    handleIncorrect();
                }
            };

            recognition.onerror = function() {
                document.getElementById("feedback-text").innerText = "تعذر التقاط الصوت، جرب التقييم اليدوي أو حاول مجدداً!";
                document.getElementById("mic-btn").classList.remove("animate-pulse", "bg-amber-500");
            };

            recognition.onend = function() {
                document.getElementById("mic-btn").classList.remove("animate-pulse", "bg-amber-500");
            };

            recognition.start();
        }

        function handleCorrect() {
            score += 10;
            document.getElementById("score").innerText = score;
            document.getElementById("feedback-text").innerText = "أحسنت يا بطل! إجابة صحيحة ⭐";
            document.getElementById("feedback-text").className = "text-2xl font-black text-emerald-600 animate-bounce";
            
            const card = document.getElementById("game-card");
            card.classList.add("bg-emerald-50", "border-emerald-300");
            setTimeout(() => card.classList.remove("bg-emerald-50", "border-emerald-300"), 600);

            document.getElementById("mic-btn").classList.add("hidden");
            document.getElementById("skip-btn").classList.add("hidden");
            document.getElementById("next-btn").classList.remove("hidden");
            document.getElementById("audio-container").innerHTML = "";

            if (wordsPool[currentIndex].weight > 1) {
                wordsPool[currentIndex].weight -= 1;
            }
        }

        function handleIncorrect() {
            document.getElementById("feedback-text").innerText = "لا بأس يا بطل، راقب المقاطع الصوتية وحاول مجدداً:";
            document.getElementById("feedback-text").className = "text-xl font-bold text-rose-500";
            document.getElementById("syllables-display").classList.remove("hidden");
            
            const container = document.getElementById("main-container");
            container.classList.add("animate-shake");
            setTimeout(() => container.classList.remove("animate-shake"), 400);

            wordsPool[currentIndex].weight += 2;

            const audioContainer = document.getElementById("audio-container");
            audioContainer.innerHTML = `
                <button onclick="playVocalizedSpeech('${currentVocalizedText}')" class="bg-sky-500 hover:bg-sky-600 text-white text-base font-bold py-2.5 px-6 rounded-full shadow-md transition transform active:scale-95 cursor-pointer animate-pulse mx-auto flex items-center gap-2">
                    🔊 استمع بالحرف الأخير الساكن
                </button>
            `;
        }

        function playVocalizedSpeech(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.45;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function skipWord() {
            wordsPool[currentIndex].weight += 1;
            loadNewWord();
        }

        function nextWord() {
            loadNewWord();
        }

        window.onload = loadNewWord;
    </script>
</body>
</html>
