<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اقرأ معي — المعلّم الذكي الصغير</title>
    <!-- Tailwind CSS للتصميم -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- خط عربي (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-400 to-indigo-600 min-h-screen flex items-center justify-center p-4 relative">

    <div class="bg-white rounded-3xl shadow-2xl p-6 md:p-10 w-full max-w-xl text-center border-4 border-amber-300">
        
        <!-- العنوان والشعار -->
        <div class="mb-6">
            <span class="text-4xl">🌟</span>
            <h1 class="text-3xl md:text-4xl font-black text-indigo-900 mt-2">اقرأ معي</h1>
            <p class="text-gray-500 font-bold text-sm">المعلّم الذكي الصغير (مشروع معاذ)</p>
        </div>

        <!-- منطقة عرض الكلمة والصورة -->
        <div id="game-card" class="bg-amber-50 rounded-2xl p-8 mb-6 border-2 border-dashed border-amber-200">
            <div id="word-emoji" class="text-7xl md:text-8xl mb-4">🐪</div>
            <div id="word-display" class="text-5xl md:text-6xl font-black text-gray-800 tracking-wider">جَمَل</div>
            <div id="syllables-display" class="text-2xl text-indigo-600 font-bold mt-3 hidden">جَـ — مَـ — ل</div>
        </div>

        <!-- منطقة التغذية الراجعة والنجوم -->
        <div id="feedback-area" class="h-16 flex items-center justify-center mb-6">
            <p id="feedback-text" class="text-xl font-bold text-gray-600">اضغط على الميكروفون أو جرب أزرار المحاكاة</p>
        </div>

        <!-- أزرار التفاعل -->
        <div class="flex flex-col gap-3">
            <!-- زر الميكروفون الأساسي -->
            <button id="mic-btn" onclick="startListening()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xl font-bold py-3 px-6 rounded-full shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
                <span>🎙️</span> ابدأ القراءة بالصوت
            </button>

            <!-- أزرار تجريبية لتسهيل الفحص على الأيباد -->
            <div class="flex gap-2 justify-center">
                <button onclick="handleCorrect()" class="bg-blue-500 hover:bg-blue-600 text-white text-sm font-bold py-2 px-4 rounded-full shadow cursor-pointer">
                    ✅ محاكاة إجابة صحيحة
                </button>
                <button onclick="handleIncorrect()" class="bg-rose-500 hover:bg-rose-600 text-white text-sm font-bold py-2 px-4 rounded-full shadow cursor-pointer">
                    ❌ محاكاة إجابة خاطئة
                </button>
            </div>

            <!-- مكان ظهور زر الاستماع عند الخطأ -->
            <div id="audio-container" class="my-1"></div>

            <!-- زر التخطي -->
            <button id="skip-btn" onclick="skipWord()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-base font-bold py-2 px-6 rounded-full shadow-sm transition cursor-pointer">
                ⏭️ تخطي هذه الكلمة
            </button>
            
            <!-- زر الكلمة التالية -->
            <button id="next-btn" onclick="nextWord()" class="bg-indigo-500 hover:bg-indigo-600 text-white text-lg font-bold py-2.5 px-6 rounded-full shadow-md hidden cursor-pointer">
                الكلمة التالية ➡️
            </button>
        </div>

        <!-- عداد النجوم -->
        <div class="mt-4 text-amber-500 text-2xl font-black">
            النجوم: <span id="score">0</span> ⭐
        </div>

    </div>

    <!-- رقم الإصدار v1.0.7 في الزاوية السفلية اليمنى -->
    <div class="absolute bottom-3 right-4 bg-black/30 backdrop-blur-sm text-white text-xs font-mono px-3 py-1 rounded-full shadow">
        v1.0.7 (Stable) 🚀
    </div>

    <!-- الكود البرمجي مدمج بالكامل هنا لضمان عدم حدوث شاشة بيضاء -->
    <script>
        let wordsPool = [
            { word: "جَمَل", emoji: "🐪", syllables: "جَـ — مَـ — ل", audioUrl: "https://ia801405.us.archive.org/24/items/arabic-words-samples/jamal.mp3", weight: 1 },
            { word: "قلم", emoji: "✏️", syllables: "قَـ — لَـ — م", audioUrl: "https://ia801405.us.archive.org/24/items/arabic-words-samples/qalam.mp3", weight: 1 },
            { word: "تفاحة", emoji: "🍎", syllables: "تُـ — فَـ — ا — حَـ — ة", audioUrl: "https://ia801405.us.archive.org/24/items/arabic-words-samples/tuffah.mp3", weight: 1 },
            { word: "شمس", emoji: "☀️", syllables: "شَـ — مْـ — س", audioUrl: "https://ia801405.us.archive.org/24/items/arabic-words-samples/shams.mp3", weight: 1 },
            { word: "كتاب", emoji: "📖", syllables: "كِـ — تَـ — ا — ب", audioUrl: "https://ia801405.us.archive.org/24/items/arabic-words-samples/kitab.mp3", weight: 1 }
        ];

        let currentIndex = 0;
        let score = 0;
        let currentTargetWord = "";
        let currentAudioUrl = "";

        function loadNewWord() {
            let totalWeight = wordsPool.reduce((sum, item) => sum + item.weight, 0);
            let randomNum = Math.random() * totalWeight;
            let currentSum = 0;

            for (let i = 0; i < wordsPool.length; i++) {
                currentSum += wordsPool[i].weight;
                if (randomNum <= currentSum) {
                    currentIndex = i;
                    break;
                }
            }

            let current = wordsPool[currentIndex];
            currentTargetWord = current.word;
            currentAudioUrl = current.audioUrl;

            document.getElementById("word-emoji").innerText = current.emoji;
            document.getElementById("word-display").innerText = current.word;
            document.getElementById("syllables-display").innerText = current.syllables;
            document.getElementById("syllables-display").classList.add("hidden");
            document.getElementById("feedback-text").innerText = "اضغط على الميكروفون أو جرب أزرار المحاكاة";
            document.getElementById("feedback-text").className = "text-xl font-bold text-gray-600";
            
            document.getElementById("mic-btn").classList.remove("hidden");
            document.getElementById("skip-btn").classList.remove("hidden");
            document.getElementById("next-btn").classList.add("hidden");
            
            document.getElementById("audio-container").innerHTML = "";
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("متصفحك لا يدعم التعرف الصوتي المباشر، استعمل أزرار المحاكاة أدناه للاختبار الفوري.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            document.getElementById("feedback-text").innerText = "جاري الاستماع... 🎧";
            document.getElementById("mic-btn").classList.add("animate-pulse", "bg-amber-500");

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript.trim();
                if (speechResult.includes(currentTargetWord) || currentTargetWord.includes(currentTargetWord)) {
                    handleCorrect();
                } else {
                    handleIncorrect();
                }
            };

            recognition.onerror = function() {
                document.getElementById("feedback-text").innerText = "تعذر التعرف الصوتي، جرب زر المحاكاة الخاطئة للاختبار!";
                document.getElementById("mic-btn").classList.remove("animate-pulse", "bg-amber-500");
            };

            recognition.onend = function() {
                document.getElementById("mic-btn").classList.remove("animate-pulse", "bg-amber-500");
            };

            recognition.start();
        }

        function handleCorrect() {
            score += 10;
            document.getElementById("score").innerText = score;
            document.getElementById("feedback-text").innerText = "أحسنت! إجابة صحيحة ⭐";
            document.getElementById("feedback-text").className = "text-2xl font-black text-emerald-600 animate-bounce";
            
            document.getElementById("mic-btn").classList.add("hidden");
            document.getElementById("skip-btn").classList.add("hidden");
            document.getElementById("next-btn").classList.remove("hidden");
            document.getElementById("audio-container").innerHTML = "";

            if (wordsPool[currentIndex].weight > 1) {
                wordsPool[currentIndex].weight -= 1;
            }
        }

        function handleIncorrect() {
            document.getElementById("feedback-text").innerText = "حاول مرة أخرى يا بطل، انتبه للتهجئة:";
            document.getElementById("feedback-text").className = "text-xl font-bold text-rose-500";
            document.getElementById("syllables-display").classList.remove("hidden");
            
            wordsPool[currentIndex].weight += 2;

            const audioContainer = document.getElementById("audio-container");
            audioContainer.innerHTML = `
                <button onclick="playRealMp3('${currentAudioUrl}')" class="bg-sky-500 hover:bg-sky-600 text-white text-base font-bold py-2 px-5 rounded-full shadow-md transition cursor-pointer animate-pulse">
                    🔊 استمع للصوت البشري النقي
                </button>
            `;
        }

        function playRealMp3(url) {
            const audio = new Audio(url);
            audio.play().catch(error => {
                console.log("خطأ في تشغيل الملف الصوتي:", error);
            });
        }

        function skipWord() {
            wordsPool[currentIndex].weight += 1;
            loadNewWord();
        }

        function nextWord() {
            loadNewWord();
        }

        window.onload = loadNewWord;
    </script>
</body>
</html>
