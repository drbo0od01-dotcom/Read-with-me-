<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اقرأ معي — المعلّم الذكي الصغير</title>
    <!-- Tailwind CSS للتصميم -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- خط عربي (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen w-full flex items-center justify-center m-0 p-4 box-border overflow-x-hidden">

    <!-- حاوية التطبيق المتوسطة للشاشة بالكامل -->
    <div id="main-container" class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-5 md:p-8 w-full max-w-md text-center border-4 border-amber-300 transition-all duration-300 my-auto mx-auto">
        
        <!-- العنوان والشعار -->
        <div class="mb-2">
            <span class="text-3xl inline-block animate-bounce">🌟</span>
            <h1 class="text-2xl md:text-3xl font-black text-indigo-900 mt-1">اقرأ معي</h1>
            <p class="text-gray-500 font-bold text-xs">المعلّم الذكي الصغير (مشروع معاذ)</p>
        </div>

        <!-- عداد الإحصائيات (صحيحة، خاطئة، متخطاة) -->
        <div class="grid grid-cols-3 gap-2 my-3 bg-gray-50 p-2 rounded-2xl border border-gray-200 text-xs font-bold">
            <div class="text-emerald-600 bg-emerald-50 py-1.5 rounded-xl border border-emerald-100">
                ✅ صح: <span id="correct-count">0</span>
            </div>
            <div class="text-rose-600 bg-rose-50 py-1.5 rounded-xl border border-rose-100">
                ❌ خطأ: <span id="incorrect-count">0</span>
            </div>
            <div class="text-amber-600 bg-amber-50 py-1.5 rounded-xl border border-amber-100">
                ⏭️ تخطي: <span id="skipped-count">0</span>
            </div>
        </div>

        <!-- منطقة عرض الكلمة فقط (بدون صور) -->
        <div id="game-card" class="bg-amber-50/80 rounded-2xl p-6 mb-3 border-2 border-dashed border-amber-300 shadow-inner transition-transform duration-300">
            <div id="word-display" class="text-5xl md:text-6xl font-black text-gray-800 tracking-wider transition-all duration-300 my-2">جَمَل</div>
            <div id="syllables-display" class="text-xl text-indigo-600 font-bold mt-3 hidden bg-indigo-50 py-1.5 rounded-xl border border-indigo-100">جَـ — مَـ — لْ</div>
        </div>

        <!-- منطقة التغذية الراجعة -->
        <div id="feedback-area" class="h-10 flex items-center justify-center mb-3">
            <p id="feedback-text" class="text-sm md:text-base font-bold text-gray-600">اضغط على الميكروفون وابدأ القراءة:</p>
        </div>

        <!-- أزرار التفاعل -->
        <div class="flex flex-col gap-2.5">
            
            <!-- زر الميكروفون الأساسي (التحقق الصوتي) -->
            <button id="mic-btn" onclick="startListening()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-base font-bold py-3 px-4 rounded-2xl shadow-lg transform transition active:scale-95 flex items-center justify-center gap-2 cursor-pointer">
                <span>🎙️</span> اضغط هنا وابدأ القراءة بصوتك
            </button>

            <!-- مكان ظهور زر الاستماع عند الخطأ -->
            <div id="audio-container" class="my-0.5"></div>

            <!-- زر التخطي -->
            <button id="skip-btn" onclick="skipWord()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold py-1.5 px-5 rounded-full shadow-sm transition cursor-pointer self-center">
                ⏭️ تخطي هذه الكلمة
            </button>
            
            <!-- زر الكلمة التالية -->
            <button id="next-btn" onclick="nextWord()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-bold py-2.5 px-5 rounded-full shadow-lg hidden cursor-pointer transform hover:scale-105 transition">
                الكلمة التالية ➡️
            </button>
        </div>

        <!-- عداد النجوم -->
        <div class="mt-3 flex items-center justify-center gap-1.5 text-amber-500 text-lg font-black bg-amber-50 py-1.5 px-3 rounded-2xl border border-amber-200 shadow-sm w-fit mx-auto">
            <span>⭐</span> النجوم: <span id="score" class="text-indigo-900">0</span>
        </div>

    </div>

    <!-- رقم الإصدار v1.0.22 في الزاوية السفلية اليمنى -->
    <div class="absolute bottom-2 right-3 bg-black/30 backdrop-blur-md text-white text-[10px] font-mono px-2.5 py-1 rounded-full shadow-lg border border-white/10 pointer-events-none">
        v1.0.22 (No Images + Shaddah Kasr) 🚀
    </div>

    <script>
        // قائمة الكلمات الـ 50 (تم تحديث بطيخ لتصبح بِطِِّيخْ، وبدون صور)
        let wordsPool = [
            { word: "جَمَل", syllables: "جَـ — مَـ — لْ", vocalized: "جَمَلْ", weight: 1 },
            { word: "قلم", syllables: "قَـ — لَـ — مْ", vocalized: "قَلَمْ", weight: 1 },
            { word: "تفاحة", syllables: "تُـ — فَـ — ا — حَـ — ةْ", vocalized: "تُفَّاحَةْ", weight: 1 },
            { word: "شمس", syllables: "شَـ — مْـ — سْ", vocalized: "شَمْسْ", weight: 1 },
            { word: "كتاب", syllables: "كِـ — تَـ — ا — بْ", vocalized: "كِتَابْ", weight: 1 },
            { word: "أسد", syllables: "أَ — سَـ — دْ", vocalized: "أَسَدْ", weight: 1 },
            { word: "كرة", syllables: "كُـ — رَ — ةْ", vocalized: "كُرَةْ", weight: 1 },
            { word: "بيت", syllables: "بَـ — يْـ — تْ", vocalized: "بَيْتْ", weight: 1 },
            { word: "باب", syllables: "بَـ — ا — بْ", vocalized: "بَابْ", weight: 1 },
            { word: "موز", syllables: "مَـ — وْ — زْ", vocalized: "مَوْزْ", weight: 1 },
            { word: "برتقال", syllables: "بُـ — رْ — تُـ — قَـ — ا — لْ", vocalized: "بُرْتُقَالْ", weight: 1 },
            { word: "حليب", syllables: "حَـ — لِـ — ي — بْ", vocalized: "حَلِيبْ", weight: 1 },
            { word: "ماء", syllables: "مَـ — ا — ءْ", vocalized: "مَاءْ", weight: 1 },
            { word: "قمر", syllables: "قَـ — مَـ — رْ", vocalized: "قَمَرْ", weight: 1 },
            { word: "نجمة", syllables: "نَـ — جْـ — مَـ — ةْ", vocalized: "نَجْمَةْ", weight: 1 },
            { word: "زهرة", syllables: "زَ — هْـ — رَ — ةْ", vocalized: "زَهْرَةْ", weight: 1 },
            { word: "شجرة", syllables: "شَـ — جَـ — رَ — ةْ", vocalized: "شَجَرَةْ", weight: 1 },
            { word: "سمكة", syllables: "سَـ — مَـ — كَـ — ةْ", vocalized: "سَمَكَةْ", weight: 1 },
            { word: "عصفور", syllables: "عُـ — صْـ — فُـ — و — رْ", vocalized: "عُصْفُورْ", weight: 1 },
            { word: "حصان", syllables: "حِـ — صَـ — ا — نْ", vocalized: "حِصَانْ", weight: 1 },
            { word: "دجاجة", syllables: "دَ — جَـ — ا — جَـ — ةْ", vocalized: "دَجَاجَةْ", weight: 1 },
            { word: "حقيبة", syllables: "حَـ — قِـ — ي — بَـ — ةْ", vocalized: "حَقِيبَةْ", weight: 1 },
            { word: "كرسي", syllables: "كُـ — رْ — سِـ — يْ", vocalized: "كُرْسِيّْ", weight: 1 },
            { word: "قلم", syllables: "قَـ — لَـ — مْ", vocalized: "قَلَمْ", weight: 1 },
            { word: "مدرسة", syllables: "مَـ — دْ — رَ — سَـ — ةْ", vocalized: "مَدْرَسَةْ", weight: 1 },
            { word: "دمية", syllables: "دُ — مْـ — يَـ — ةْ", vocalized: "دُمْيَةْ", weight: 1 },
            { word: "سيارة", syllables: "سَـ — يَّـ — ا — رَ — ةْ", vocalized: "سَيَّارَةْ", weight: 1 },
            { word: "طائرة", syllables: "طَـ — ا — ئِـ — رَ — ةْ", vocalized: "طَائِرَةْ", weight: 1 },
            { word: "قارب", syllables: "قَـ — ا — رِ — بْ", vocalized: "قَارِبْ", weight: 1 },
            { word: "علم", syllables: "عَـ — لَـ — مْ", vocalized: "عَلَمْ", weight: 1 },
            { word: "فيل", syllables: "فِـ — ي — لْ", vocalized: "فِيلْ", weight: 1 },
            { word: "قرد", syllables: "قَـ — رْ — دْ", vocalized: "قَرْدْ", weight: 1 },
            { word: "زرافة", syllables: "زَ — رَ — ا — فَـ — ةْ", vocalized: "زَرَافَةْ", weight: 1 },
            { word: "بقرة", syllables: "بَـ — قَـ — رَ — ةْ", vocalized: "بَقَرَةْ", weight: 1 },
            { word: "خروف", syllables: "خَـ — رُ — و — فْ", vocalized: "خَرُوفْ", weight: 1 },
            { word: "عنب", syllables: "عِـ — نَـ — بْ", vocalized: "عِنَبْ", weight: 1 },
            { word: "بطيخ", syllables: "بِـ — طِّـ — ي — خْ", vocalized: "بِطِِّيخْ", weight: 1 }, // تم تعديل الشدة والكسر على الطاء
            { word: "خوخ", syllables: "خَـ — وْ — خْ", vocalized: "خَوْخْ", weight: 1 },
            { word: "تمر", syllables: "تَـ — مَـ — رْ", vocalized: "تَمَرْ", weight: 1 },
            { word: "خبز", syllables: "خَـ — بْـ — زْ", vocalized: "خَبْزْ", weight: 1 },
            { word: "جبن", syllables: "جُـ — بْـ — نْ", vocalized: "جُبْنْ", weight: 1 },
            { word: "بيض", syllables: "بَـ — يْـ — ضْ", vocalized: "بَيْضْ", weight: 1 },
            { word: "مفتاح", syllables: "مِـ — فْـ — تَـ — ا — حْ", vocalized: "مِفْتَاحْ", weight: 1 },
            { word: "قفل", syllables: "قَـ — فْـ — لْ", vocalized: "قَفْلْ", weight: 1 },
            { word: "ساعة", syllables: "سَـ — ا — عَـ — ةْ", vocalized: "سَاعَةْ", weight: 1 },
            { word: "هاتف", syllables: "هَـ — ا — تِـ — فْ", vocalized: "هَاتِفْ", weight: 1 },
            { word: "تلوين", syllables: "تَـ — لْـ — وِ — ي — نْ", vocalized: "تَلْوِينْ", weight: 1 },
            { word: "دفتر", syllables: "دَ — فْـ — تَـ — رْ", vocalized: "دَفْتَرْ", weight: 1 },
            { word: "مسطرة", syllables: "مِـ — سْـ — طَـ — رَ — ةْ", vocalized: "مِسْطَرَةْ", weight: 1 },
            { word: "مقص", syllables: "مِـ — قْـ — صْ", vocalized: "مِقْصْ", weight: 1 }
        ];

        let currentIndex = 0;
        let score = 0;
        let correctCount = 0;
        let incorrectCount = 0;
        let skippedCount = 0;
        
        let currentTargetWord = "";
        let currentVocalizedText = "";

        function updateStats() {
            document.getElementById("score").innerText = score;
            document.getElementById("correct-count").innerText = correctCount;
            document.getElementById("incorrect-count").innerText = incorrectCount;
            document.getElementById("skipped-count").innerText = skippedCount;
        }

        function loadNewWord() {
            let totalWeight = wordsPool.reduce((sum, item) => sum + item.weight, 0);
            let randomNum = Math.random() * totalWeight;
            let currentSum = 0;

            for (let i = 0; i < wordsPool.length; i++) {
                currentSum += wordsPool[i].weight;
                if (randomNum <= currentSum) {
                    currentIndex = i;
                    break;
                }
            }

            let current = wordsPool[currentIndex];
            currentTargetWord = current.word;
            currentVocalizedText = current.vocalized;

            const card = document.getElementById("game-card");
            card.classList.add("scale-95", "opacity-50");
            
            setTimeout(() => {
                document.getElementById("word-display").innerText = current.word;
                document.getElementById("syllables-display").innerText = current.syllables;
                document.getElementById("syllables-display").classList.add("hidden");
                document.getElementById("feedback-text").innerText = "اضغط على الميكروفون وابدأ القراءة:";
                document.getElementById("feedback-text").className = "text-sm md:text-base font-bold text-gray-600";
                
                card.classList.remove("scale-95", "opacity-50");
            }, 150);

            document.getElementById("mic-btn").classList.remove("hidden");
            document.getElementById("skip-btn").classList.remove("hidden");
            document.getElementById("next-btn").classList.add("hidden");
            document.getElementById("audio-container").innerHTML = "";
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("متصفحك لا يدعم التحقق الصوتي المباشر.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            document.getElementById("feedback-text").innerText = "جاري الاستماع لصوتك... 🎧";
            document.getElementById("mic-btn").classList.add("animate-pulse", "bg-amber-500");

            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript.trim();
                if (speechResult.includes(currentTargetWord)) {
                    handleCorrect();
                } else {
                    handleIncorrect();
                }
            };

            recognition.onerror = function() {
                document.getElementById("feedback-text").innerText = "تعذر التقاط الصوت، حاول مجدداً!";
                document.getElementById("mic-btn").classList.remove("animate-pulse", "bg-amber-500");
            };

            recognition.onend = function() {
                document.getElementById("mic-btn").classList.remove("animate-pulse", "bg-amber-500");
            };

            recognition.start();
        }

        function handleCorrect() {
            score += 10;
            correctCount++;
            updateStats();

            document.getElementById("feedback-text").innerText = "أحسنت يا بطل! إجابة صحيحة ⭐";
            document.getElementById("feedback-text").className = "text-lg md:text-xl font-black text-emerald-600 animate-bounce";
            
            const card = document.getElementById("game-card");
            card.classList.add("bg-emerald-50", "border-emerald-300");
            setTimeout(() => card.classList.remove("bg-emerald-50", "border-emerald-300"), 600);

            document.getElementById("mic-btn").classList.add("hidden");
            document.getElementById("skip-btn").classList.add("hidden");
            document.getElementById("next-btn").classList.remove("hidden");
            document.getElementById("audio-container").innerHTML = "";

            if (wordsPool[currentIndex].weight > 1) {
                wordsPool[currentIndex].weight -= 1;
            }
        }

        function handleIncorrect() {
            incorrectCount++;
            updateStats();

            document.getElementById("feedback-text").innerText = "لا بأس يا بطل، راقب المقاطع الصوتية:";
            document.getElementById("feedback-text").className = "text-sm md:text-base font-bold text-rose-500";
            document.getElementById("syllables-display").classList.remove("hidden");
            
            const container = document.getElementById("main-container");
            container.classList.add("animate-shake");
            setTimeout(() => container.classList.remove("animate-shake"), 400);

            wordsPool[currentIndex].weight += 2;

            const audioContainer = document.getElementById("audio-container");
            audioContainer.innerHTML = `
                <button onclick="playVocalizedSpeech('${currentVocalizedText}')" class="bg-sky-500 hover:bg-sky-600 text-white text-xs md:text-sm font-bold py-2 px-5 rounded-full shadow-md transition transform active:scale-95 cursor-pointer animate-pulse mx-auto flex items-center gap-1.5">
                    🔊 استمع للنطق
                </button>
            `;
        }

        function playVocalizedSpeech(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = 0.45;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function skipWord() {
            skippedCount++;
            updateStats();

            wordsPool[currentIndex].weight += 1;
            loadNewWord();
        }

        function nextWord() {
            loadNewWord();
        }

        window.onload = function() {
            updateStats();
            loadNewWord();
        };
    </script>
</body>
</html>
